    // 売上履歴 関連関数
    function openHistoryModal() {
      renderHistoryList();
      document.getElementById('history-modal').classList.remove('hidden');
    }

    function closeHistoryModal() {
      document.getElementById('history-modal').classList.add('hidden');
    }

    function renderHistoryList() {
      const container = document.getElementById('history-list');
      const todayStr = new Date().toISOString().split('T')[0];

      let todayTotal = 0;
      let todayCount = 0;

      salesHistory.forEach(tx => {
        if (tx.rawDate && tx.rawDate.startsWith(todayStr)) {
          todayTotal += tx.total;
          todayCount++;
        }
      });

      document.getElementById('history-today-total').textContent = `¥${todayTotal.toLocaleString()}`;
      document.getElementById('history-today-count').textContent = `${todayCount} 件`;
      document.getElementById('history-total-count').textContent = `${salesHistory.length} 件`;

      if (salesHistory.length === 0) {
        container.innerHTML = `
          <div class="text-center text-slate-400 py-12">
            <i class="fa-solid fa-receipt text-4xl mb-2 text-slate-300"></i>
            <p class="text-sm">会計履歴がまだありません</p>
          </div>
        `;
        return;
      }

      container.innerHTML = salesHistory.map(tx => {
        const itemSummary = tx.items.map(i => `${i.name}×${i.qty}`).join(' / ');
        return `
          <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm hover:shadow transition">
            <div class="flex justify-between items-start mb-2">
              <div>
                <span class="text-xs font-mono bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${tx.id}</span>
                <span class="text-xs text-slate-500 ml-2">${tx.timestamp}</span>
              </div>
              <span class="text-lg font-bold text-blue-600">¥${tx.total.toLocaleString()}</span>
            </div>
            <div class="text-sm text-slate-700 font-medium mb-2">${itemSummary}</div>
            <div class="flex justify-between items-center text-xs text-slate-500 border-t border-slate-100 pt-2">
              <span>(小計 ¥${tx.subtotal.toLocaleString()} + 税 ¥${tx.tax.toLocaleString()})</span>
              <button onclick="reprintReceipt('${tx.id}')" class="text-blue-600 hover:text-blue-800 font-bold flex items-center gap-1">
                <i class="fa-solid fa-print"></i> 再印刷
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function reprintReceipt(txId) {
      const tx = salesHistory.find(t => t.id === txId);
      if (!tx) return;

      document.getElementById('print-store-name').textContent = settings.storeName || '店名';
      document.getElementById('print-store-tel').textContent = `TEL: ${settings.storeTel || '03-1234-5678'}`;
      document.getElementById('print-timestamp').textContent = tx.timestamp + ' (再発行)';

      const tbody = document.getElementById('print-items-body');
      tbody.innerHTML = tx.items.map(item => `
        <tr>
          <td style="text-align: left; padding: 2px 0;">${item.name}</td>
          <td style="text-align: right; padding: 2px 0;">${item.qty}</td>
          <td style="text-align: right; padding: 2px 0;">¥${item.itemTotal.toLocaleString()}</td>
        </tr>
      `).join('');

      document.getElementById('print-subtotal').textContent = `¥${tx.subtotal.toLocaleString()}`;
      document.getElementById('print-tax').textContent = `¥${tx.tax.toLocaleString()}`;
      document.getElementById('print-total').textContent = `¥${tx.total.toLocaleString()}`;

      window.print();
    }

    function clearSalesHistory() {
      if (confirm('すべての売上履歴を削除しますか？この操作は取り消せません。')) {
        salesHistory = [];
        localStorage.removeItem('pos_sales_history');
        renderHistoryList();
      }
    }

    function exportHistoryCSV() {
      if (salesHistory.length === 0) {
        alert('出力できる履歴がありません');
        return;
      }

      let csvContent = '\uFEFF取引ID,日時,商品名,数量,単価,小計,消費税,合計\n';
      salesHistory.forEach(tx => {
        tx.items.forEach(item => {
          csvContent += `"${tx.id}","${tx.timestamp}","${item.name}",${item.qty},${item.price},${tx.subtotal},${tx.tax},${tx.total}\n`;
        });
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `sales_history_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
